name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff pytest numpy
      - run: ruff check .
      - run: pytest -q   # labels + metrics; no model download

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t skillex .

  # Quality gate: re-evaluates the published model and fails if F1 regresses.
  # Set repo variable MODEL_ID (Settings → Secrets and variables → Actions → Variables).
  eval-gate:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ vars.MODEL_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install ".[train]"
      - run: python -m skillex.evaluate --model "${{ vars.MODEL_ID }}" --limit 1000 --min-f1 "${{ vars.MIN_F1 || '0.50' }}"
