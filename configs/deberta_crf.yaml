# Best setup from the sweep: DeBERTa-v3 + learned BIO CRF per head.
# Test F1 0.645 +/- 0.005 over 3 seeds (validation 0.647). Seed 43 was best on validation.
run_name: deberta-crf
base_model: microsoft/deberta-v3-base
dataset: jjzha/skillspan
output_dir: outputs/deberta-crf
hub_model_id: null   # set at run time: --set hub_model_id=USER/deberta-v3-skillspan-crf
max_length: 256
crf: true
learning_rate: 3.0e-5
epochs: 5
batch_size: 32
weight_decay: 0.01
warmup_ratio: 0.1
fp16: true
report_to: none
seed: 43
