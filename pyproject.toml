[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillex"
version = "0.1.0"
description = "Skill & knowledge extraction from job postings (token classification on SkillSpan)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["transformers>=5.0", "numpy"]

[project.optional-dependencies]
train = ["torch", "datasets>=2.20", "accelerate>=1.1", "pyyaml", "wandb"]
serve = ["torch", "fastapi>=0.110", "uvicorn[standard]", "prometheus-fastapi-instrumentator>=7"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
